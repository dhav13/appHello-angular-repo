<div class="row">
    <div class="col-12">
        <h5>Sign-In</h5>
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Sign-up</h5>
                <form (ngSubmit)="onSubmit(signUpForm)" #signUpForm="ngForm">
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="inputEmail4">Email</label>
                            <input type="email" class="form-control" id="inputEmail4" placeholder="Email" ngModel name="email" #email="ngModel"
                                email required>
                            @if (email.invalid && email.touched) {
                                @if (email.errors?.['required']) {
                                    <div class="alert alert-danger">
                                        Email is required
                                    </div>
                                }@else {
                                    <div class="alert alert-danger">
                                        Incorrect email
                                    </div>
                                }
                            }
                        </div>
                        <div class="form-group col-md-6">
                            <label for="inputPassword4">Password</label>
                            <input type="password" class="form-control" id="inputPassword4" placeholder="Password" ngModel name="password" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="inputAddress">Address</label>
                        <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St" ngModel name="address" required>
                    </div>
                    <div class="form-group">
                        <label for="inputAddress2">Address 2</label>
                        <input type="text" class="form-control" id="inputAddress2"
                            placeholder="Apartment, studio, or floor" ngModel name="address2" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="inputCity">City</label>
                            <input type="text" class="form-control" id="inputCity" ngModel name="city" required>
                        </div>
                         <div class="form-group col-md-4">
                            <label for="inputState">State</label>
                            <select id="inputState" class="form-control">
                                <option selected>Choose...</option>
                                <option>Maharashtra</option>
                                <option>Goa</option>
                            </select>
                        </div>
                        <div class="form-group col-md-2">
                            <label for="inputZip">Zip</label>
                            <input type="text" class="form-control" id="inputZip" ngModel name="pincode" minlength="7" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="gridCheck" ngModel name="checkme">
                            <label class="form-check-label" for="gridCheck">
                                Check me out
                            </label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign in</button>
                </form>
            </div>
        </div>
    </div>
</div>
